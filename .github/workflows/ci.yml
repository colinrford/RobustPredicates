name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (${{ matrix.configuration }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcrun swift --version
      - name: Build (warnings as errors)
        run: xcrun swift build -c ${{ matrix.configuration }} -Xswiftc -warnings-as-errors
      # Release matters here: error-free transforms break if the optimizer
      # reassociates or contracts floating-point ops.
      - name: Test
        run: xcrun swift test -c ${{ matrix.configuration }} -Xswiftc -enable-testing

  linux:
    name: Linux (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    container: swift:6.2
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build (warnings as errors)
        run: swift build -c ${{ matrix.configuration }} -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test -c ${{ matrix.configuration }} -Xswiftc -enable-testing
